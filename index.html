const K='bandingNilaiV1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    ['tmin','tmax','tmean','tsd'].forEach(t=>{if(r[t]===''&&m[t]!==''&&m[t]!=null)r[t]=m[t]})});n.maps[k]=Object.values(g)}});return n}

const IC={edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',del:'<path d="M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14M10 11v6M14 11v6"/>'};

// ---------- import ----------
const SKIP=/^(no|nis|nisn|nama|jk|l\/p|jumlah|jml|rata|predikat|rank|ranking|peringkat|ket)/i;
function build(r,hi){const h=r[hi].map(c=>c==null?'':String(c).trim()),nx=r[hi+1]||[];
 const sb=(nx[0]==null||nx[0]==='')&&nx.some(c=>c!=null&&String(c).trim()!=='');let last='',lab=[];
 h.forEach((m,i)=>{if(m)last=m;const s=sb&&nx[i]!=null?String(nx[i]).trim():'';lab.push(s?((m||last)+' '+s):m)});
 const ni=h.findIndex(x=>/^nama/i.test(x)),st=[],used=new Set();
 for(let i=hi+1+(sb?1:0);i<r.length;i++){const row=r[i];if(!row||!row[ni])break;const sc={};
  lab.forEach((l,c)=>{if(!l||SKIP.test(l))return;const v=parseFloat(String(row[c]).replace(',','.'));if(!isNaN(v)){sc[l]=v;used.add(l)}});
  st.push({id:uid(),name:String(row[ni]).trim(),scores:sc})}
 return{subjects:lab.filter(l=>used.has(l)),students:st}}
function parseWb(wb){let best=null;wb.SheetNames.forEach(n=>{const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
 const hi=r.findIndex(x=>x.some(c=>/^nama/i.test(String(c||'').trim())));if(hi<0)return;const p=build(r,hi);
 if(!best||p.students.length*p.subjects.length>best.students.length*best.subjects.length)best=p});return best}
async function doImport(g,files){let nw=0,up=0,bad=0;
 for(const f of files){try{const p=parseWb(XLSX.read(await f.arrayBuffer(),{type:'array'}));if(!p||!p.students.length){bad++;continue}
  const label=f.name.replace(/\.xlsx?$/i,''),ex=S.ds.find(d=>d.grp===g&&d.label.toLowerCase()===label.toLowerCase());
  if(ex){Object.assign(ex,{file:f.name,...p});S.sel[g]=ex.id;up++}else{const x={id:uid(),grp:g,label,file:f.name,...p};S.ds.push(x);S.sel[g]=x.id;nw++}}catch(e){bad++}}
 save();render();toast(`${nw} data baru, ${up} data diperbarui`+(bad?`, ${bad} file gagal`:''))}
// ---------- matching, mapel, konversi ----------
const tok=s=>s.toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
function sim(a,b){const[s,l]=a.length<=b.length?[a,b]:[b,a];let m=0;s.forEach(t=>{if(l.some(u=>u.startsWith(t)||t.startsWith(u)))m++});return m/s.length*(s.length/l.length>.6?1:.8)}
function match(A,B){const ps=[],ta=A.students.map(a=>tok(a.name)),tb=B.students.map(b=>tok(b.name));A.students.forEach((a,i)=>B.students.forEach((b,j)=>{const s=sim(ta[i],tb[j]);if(s>=.75)ps.push([s,a,b])}));
 ps.sort((x,y)=>y[0]-x[0]);const ua=new Set,ub=new Set,out=[];ps.forEach(([s,a,b])=>{if(ua.has(a.id)||ub.has(b.id))return;ua.add(a.id);ub.add(b.id);out.push([a,b])});
 A.students.forEach(a=>ua.has(a.id)||out.push([a,null]));B.students.forEach(b=>ub.has(b.id)||out.push([null,b]));return out}
function stats(arr){const v=arr.filter(x=>x!=null);if(!v.length)return{};const m=v.reduce((a,b)=>a+b,0)/v.length;return{min:Math.min(...v),max:Math.max(...v),mean:m,sd:Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)}}
const CM={bindo:'indonesia',bindonesia:'indonesia',bahasaindonesia:'indonesia',bing:'inggris',binggris:'inggris',bahasainggris:'inggris',mtk:'matematika',mtl:'mtl',matematikatingkatlanjut:'mtl',bio:'biologi',kim:'kimia',fis:'fisika',pp:'pancasila',pendidikanpancasila:'pancasila',fik:'fiqh',fikih:'fiqh',paifik:'fiqh',ski:'tarikh',paiski:'tarikh',aa:'tauhid',paiaa:'tauhid',paiqh:'quran',alquran:'quran',bar:'nahwu'};
const canon=s=>{const k=s.toLowerCase().replace(/[^a-z]/g,'');return CM[k]||k};
const blank=()=>({tmin:'',tmax:'',tmean:'',tsd:''});
const autoFrom=(to,B)=>B.subjects.filter(k=>canon(k)===canon(to));
const srcOf=(m,B)=>(m.from||[]).filter(k=>B.subjects.includes(k));
const combOf=(s,ks)=>{const v=ks.map(k=>s.scores[k]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const mapsOf=(B,A)=>(S.maps[B.id]||[]).filter(m=>A.subjects.includes(m.to));
const activeMaps=(B,A)=>mapsOf(B,A).filter(m=>srcOf(m,B).length);
function fill(B,A){const m=S.maps[B.id]||(S.maps[B.id]=[]);A.subjects.forEach(k=>{if(!m.some(x=>x.to===k))m.push({id:uid(),to:k,from:autoFrom(k,B),off:false,...blank()})});save()}
function tgt(m,A){const arr=[];A.students.forEach(s=>{if(s.scores[m.to]!=null)arr.push(s.scores[m.to])});const t=stats(arr);
 ['min','max','mean','sd'].forEach(k=>{const o=m['t'+k];if(o!==''&&o!=null&&!isNaN(+o))t[k]=+o});return t}
function effRange(A){const c=S.conv;let lo=parseFloat(c.lo),hi=parseFloat(c.hi);const s=stats(A?A.students.flatMap(x=>Object.values(x.scores)):[]);if(isNaN(lo))lo=s.min??70;if(isNaN(hi))hi=s.max??100;return[lo,hi]}
function convert(B,A){const res={},d=+S.conv.dec,c=S.conv,[lo,hi]=effRange(A),ms=activeMaps(B,A),mc=c.method==='none'?[]:ms.filter(m=>!m.off);

 ms.forEach(m=>{const ks=srcOf(m,B);B.students.forEach(s=>{const v=combOf(s,ks);if(v!=null){const r=res[s.id];r.orig[m.to]=v;r.raw[m.to]=v;r.scores[m.to]=+v.toFixed(d)}})});
 if(mc.length){const lin=(b,a,z)=>x=>b.max===b.min?z:a+(x-b.min)*(z-a)/(b.max-b.min);
  const gb=c.method==='auto'&&c.scope==='all'?stats(mc.flatMap(m=>B.students.map(s=>res[s.id].orig[m.to]))):null;
  mc.forEach(m=>{const b=gb||stats(B.students.map(s=>res[s.id].orig[m.to]));if(b.mean==null)return;let f;
   if(c.method==='auto'){const a=m.tmin!==''&&!isNaN(+m.tmin)?+m.tmin:lo,z=m.tmax!==''&&!isNaN(+m.tmax)?+m.tmax:hi;f=lin(b,a,z)}
   else{const t=tgt(m,A);if(t.mean==null)return;f=c.method==='ref'?lin(b,t.min,t.max):x=>b.sd?t.mean+(x-b.mean)*t.sd/b.sd:t.mean}
   B.students.forEach(s=>{const v=res[s.id].orig[m.to];if(v==null)return;const r=Math.min(100,Math.max(0,f(v)));res[s.id].raw[m.to]=r;res[s.id].scores[m.to]=+r.toFixed(d)})})}

function check(B,A,cv){let c=0;activeMaps(B,A).forEach(m=>{const l=B.students.filter(s=>cv[s.id].orig[m.to]!=null),a=ranks(l.map(s=>cv[s.id].orig[m.to])),b=ranks(l.map(s=>cv[s.id].raw[m.to]));c+=a.filter((r,i)=>r!==b[i]).length});

function cmpRows(A,B,mp){const cv=convert(B,A),m=match(A,B),ks=mp?srcOf(mp,B):[];
 const gA=a=>a?(mp?a.scores[mp.to]??null:avg(a)):null,gB=b=>b?(mp?combOf(b,ks):avg(b)):null,gC=b=>b?(mp?cv[b.id].scores[mp.to]??null:cv[b.id].avg):null,gK=b=>b?(mp?cv[b.id].raw[mp.to]??null:cv[b.id].rk):null;
 const rows=m.map(([a,b])=>({a,b,A:gA(a),Bo:gB(b),Bc:gC(b),K:gK(b)})),ra=ranks(rows.map(r=>r.A)),ro=ranks(rows.map(r=>r.Bo)),rc=ranks(rows.map(r=>r.K));rows.forEach((r,i)=>{r.rA=ra[i];r.rO=ro[i];r.rC=rc[i]});return rows}
function crkOf(d){const m={};if(!d.all)return m;const by={};d.students.forEach(s=>(by[d.cls[s.id]]=by[d.cls[s.id]]||[]).push(s));for(const k in by){const r=ranks(by[k].map(avg));by[k].forEach((s,i)=>m[s.id]=r[i])}return m}
// ---------- nilai harian (NH) ----------
const NHN=10,NHI=[...Array(NHN).keys()],nkey=(n,k)=>tok(n).join(' ')+'|'+String(k||'').trim().toUpperCase();
function parseNH(wb,fname){let best=null;wb.SheetNames.forEach(n=>{const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
 const hi=r.findIndex(x=>x.some(c=>/^nama/i.test(String(c||'').trim())));if(hi<0)return;
 const h=r[hi].map(c=>c==null?'':String(c).trim()),ni=h.findIndex(x=>/^nama/i.test(x)),ki=h.findIndex(x=>/^kelas/i.test(x)),cols={};let over=0;
 h.forEach((x,i)=>{const m=/^nh\s*[-_.]?\s*0*(\d{1,2})$/i.exec(x);if(!m)return;const k=+m[1];if(k>=1&&k<=NHN)cols[k-1]=i;else if(k>NHN)over++});

  const nh=Array(NHN).fill(null);Object.keys(cols).forEach(k=>{const v=parseFloat(String(row[cols[k]]??'').replace(',','.'));if(!isNaN(v))nh[k]=v});
  rows.push({name:String(row[ni]).trim(),kelas:ki>=0&&row[ki]!=null&&String(row[ki]).trim()?String(row[ki]).trim():fname.replace(/\.xlsx?$/i,''),nh})}

async function importNH(files){let add=0,upd=0,bad=0,over=0;const D=S.nh;
 for(const f of files){try{const p=parseNH(XLSX.read(await f.arrayBuffer(),{type:'array'}),f.name);if(!p||!p.rows.length||!p.cols.length){bad++;continue}over+=p.over;
  p.rows.forEach(x=>{const ex=D.rows.find(y=>nkey(y.name,y.kelas)===nkey(x.name,x.kelas));
   if(ex){p.cols.forEach(c=>ex.nh[c]=x.nh[c]);upd++}else{const n=Array(NHN).fill(null);p.cols.forEach(c=>n[c]=x.nh[c]);D.rows.push({id:uid(),name:x.name,kelas:x.kelas,nh:n});add++}})}catch(e){bad++}}
 save();render();toast(`${add} siswa baru, ${upd} diperbarui`+(bad?`, ${bad} file gagal (butuh kolom Nama & NH1…NH${NHN})`:'')+(over?`, kolom NH di atas ${NHN} diabaikan`:''))}
function convertNH(){const D=S.nh,c=D.conv,d=Math.min(4,Math.max(0,+c.dec||0)),[lo0,hi0]=effRange(cur('A')),pf=v=>{const x=parseFloat(v);return isNaN(x)?null:x};
 const lo=pf(c.lo)??lo0,hi=pf(c.hi)??hi0,out={};D.rows.forEach(r=>out[r.id]={raw:Array(NHN).fill(null),nh:Array(NHN).fill(null)});
 const grp={};D.rows.forEach(r=>(grp[c.by==='kelas'?r.kelas:'*']=grp[c.by==='kelas'?r.kelas:'*']||[]).push(r));
 Object.values(grp).forEach(G=>{const pool=c.scope==='all'?stats(G.flatMap(r=>r.nh.filter(x=>x!=null))):null;
  NHI.forEach(i=>{const b=pool||stats(G.map(r=>r.nh[i]));if(b.mean==null)return;let f;
   if(c.method==='auto')f=x=>b.max===b.min?hi:lo+(x-b.min)*(hi-lo)/(b.max-b.min);
   else if(c.method==='meansd'){const tm=pf(c.tmean),ts=pf(c.tsd);f=tm==null?x=>x:x=>b.sd?tm+(x-b.mean)*(ts==null?1:ts/b.sd):tm}
   else f=x=>x;
   G.forEach(r=>{const v=r.nh[i];if(v==null)return;const z=c.method==='none'?v:Math.min(100,Math.max(0,f(v)));out[r.id].raw[i]=z;out[r.id].nh[i]=+z.toFixed(d)})})});
